<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a call</title>
<meta name="description" content="Tell us a little about what you need, then pick a time that suits you.">
<style>
/* Two steps on one page. Step 1 is our form (so attribution is captured on our domain).
   Step 2 shows the host's Google appointment page inside an iframe. */
:root{
  --bg:#f6f7f8; --surface:#ffffff; --fg:#1b2328; --muted:#5d6b73; --line:#d6dde2;
  --accent:#0b6e67; --accent-ink:#ffffff; --bad:#9b2c2c; --bad-soft:#fae4e4;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111618; --surface:#181f22; --fg:#e6ebee; --muted:#9aaab3; --line:#2a353b;
  --accent:#4fb8ad; --accent-ink:#0c1a18; --bad:#ef8c8c; --bad-soft:#3a1a1a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111618; --surface:#181f22; --fg:#e6ebee; --muted:#9aaab3; --line:#2a353b;
  --accent:#4fb8ad; --accent-ink:#0c1a18; --bad:#ef8c8c; --bad-soft:#3a1a1a; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 16px 80px}
h1{font-size:1.9rem;line-height:1.15;margin:0 0 .4rem;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 1.4rem}
form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
label{display:block;margin:0 0 1rem;font-weight:600}
input,textarea{display:block;width:100%;margin-top:.3rem;padding:.6rem .7rem;font:inherit;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
@media (max-width:480px){.two{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0 0 1rem}
legend{font-weight:600;margin-bottom:.4rem;padding:0}
.choice{display:flex;gap:.6rem;align-items:flex-start;font-weight:400;padding:.55rem .7rem;border:1px solid var(--line);border-radius:6px;margin-bottom:.5rem;cursor:pointer}
.choice input{width:auto;margin:.25rem 0 0}
.choice small{color:var(--muted);display:block}
.consent{display:flex;gap:.6rem;align-items:flex-start;font-weight:400}
.consent input{width:auto;margin:.3rem 0 0}
.hp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:.75rem 1.2rem;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.error{background:var(--bad-soft);color:var(--bad);padding:.6rem .8rem;border-radius:6px;margin:1rem 0 0}
.frame{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
iframe{display:block;width:100%;height:720px;border:0}
.small{font-size:.92rem;color:var(--muted)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <section id="step1">
    <h1>Book a call</h1>
    <p class="lede">Tell us a little first, then pick a time that suits you.</p>
    <form id="booking-form" novalidate>
      <div class="two">
        <label>First name <input name="first_name" required autocomplete="given-name"></label>
        <label>Last name <input name="last_name" autocomplete="family-name"></label>
      </div>
      <label>Email <input type="email" name="email" required autocomplete="email" inputmode="email"></label>
      <label>Mobile <input type="tel" name="phone" autocomplete="tel" inputmode="tel"></label>
      <fieldset>
        <legend>What kind of call?</legend>
        <label class="choice"><input type="radio" name="meeting_type" value="discovery" checked> <span><b>Discovery call</b><small>15 minutes. A first conversation about where you are.</small></span></label>
        <label class="choice"><input type="radio" name="meeting_type" value="strategy"> <span><b>Strategy session</b><small>30 minutes. You already know what you need help with.</small></span></label>
      </fieldset>
      <label>What do you need help with? <textarea name="need" rows="3" maxlength="1000"></textarea></label>
      <label class="consent"><input type="checkbox" name="consent" required> <span>I'm happy to be contacted about this enquiry.</span></label>
      <div class="hp" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
      <button type="submit" id="submit">Continue to pick a time</button>
      <p class="error" id="form-error" hidden></p>
    </form>
  </section>

  <section id="step2" hidden>
    <h1>Pick a time</h1>
    <p class="lede" id="step2-lede"></p>
    <div class="frame"><iframe id="booking-frame" title="Choose an appointment time" loading="lazy"></iframe></div>
    <p class="small">Google sends the calendar invite and the confirmation email. The invite carries the reschedule and cancel links. <a id="booking-link" href="#" target="_blank" rel="noopener">Open the booking page in a new tab</a> if it does not load here.</p>
  </section>
</main>

<script>
(function () {
  // ---- Edit these two lines ------------------------------------------------
  var N8N_WEBHOOK = 'https://YOUR-N8N-HOST/webhook/book';   // production URL of the Router workflow's webhook
  var STORE_DAYS = 90;                                       // how long a first click is remembered on this device
  // -------------------------------------------------------------------------

  var STORE_KEY = 'booking_attribution';
  var KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term',
              'gclid','gbraid','wbraid','fbclid','ttclid','msclkid'];

  function readStore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o.saved || Date.now() - o.saved > STORE_DAYS * 86400000) return null;
      return o;
    } catch (e) { return null; }
  }
  function writeStore(o) { try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); } catch (e) {} }

  // A fresh campaign click on this page replaces what was stored; otherwise the
  // stored first touch is used, so a visitor who comes back later via a bookmark
  // still carries the ad that brought them.
  function captureAttribution() {
    var params = new URLSearchParams(location.search);
    var fresh = {}, any = false;
    KEYS.forEach(function (k) { var v = params.get(k); if (v) { fresh[k] = v.slice(0, 250); any = true; } });
    var stored = readStore();
    if (any || !stored) {
      fresh.landing_url = location.href.split('#')[0].slice(0, 250);
      fresh.referrer = (document.referrer || '').slice(0, 250);
      fresh.saved = Date.now();
      writeStore(fresh);
      return fresh;
    }
    return stored;
  }

  // Google's long booking URL (calendar.google.com/.../schedules/ID) accepts gv=true for embedding.
  function embedUrl(url) {
    try {
      var u = new URL(url);
      if (u.hostname === 'calendar.google.com' && !u.searchParams.has('gv')) u.searchParams.set('gv', 'true');
      return u.toString();
    } catch (e) { return url; }
  }

  var attribution = captureAttribution();
  var bookingKey = 'bk_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  var form = document.getElementById('booking-form');
  var button = document.getElementById('submit');
  var errorBox = document.getElementById('form-error');

  function showError(msg) { errorBox.textContent = msg; errorBox.hidden = false; button.disabled = false; }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorBox.hidden = true;
    var data = new FormData(form);
    var payload = {
      first_name: data.get('first_name'), last_name: data.get('last_name'),
      email: data.get('email'), phone: data.get('phone'),
      meeting_type: data.get('meeting_type'), need: data.get('need'),
      consent: !!data.get('consent'), website: data.get('website'),
      booking_key: bookingKey,
      page_url: location.href.split('#')[0].slice(0, 250)
    };
    Object.keys(attribution).forEach(function (k) { if (k !== 'saved') payload[k] = attribution[k]; });

    if (!payload.first_name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(payload.email || '')) {
      return showError('Please add your first name and a valid email.');
    }
    if (!payload.consent) return showError('Please tick the box so we can contact you.');

    button.disabled = true;
    fetch(N8N_WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.body || !res.body.ok || !res.body.booking_url) {
          return showError('Something went wrong on our side. Please try again, or email us.');
        }
        document.getElementById('step2-lede').textContent =
          'You will meet ' + (res.body.host_name || 'us') + ' for a ' + (res.body.meeting_label || 'call').toLowerCase() + '. Choose a slot below.';
        var frame = document.getElementById('booking-frame');
        frame.src = embedUrl(res.body.booking_url);
        document.getElementById('booking-link').href = res.body.booking_url;
        document.getElementById('step1').hidden = true;
        document.getElementById('step2').hidden = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        // Hook for your analytics (Umami, PostHog, GTM). Listen with document.addEventListener('booking:requested', ...).
        document.dispatchEvent(new CustomEvent('booking:requested', { detail: { meeting_type: payload.meeting_type, booking_key: bookingKey } }));
      })
      .catch(function () { showError('We could not reach the booking service. Please try again in a moment.'); });
  });
})();
</script>
</body>
</html>
